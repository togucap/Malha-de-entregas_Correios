<style>
/* Tela "Acompanhamento - OUT": barra de pesquisa/filtros e tabela. Só tokens. */

.barra-filtros {
  display: grid;
  grid-template-columns: minmax(240px, 1.4fr) repeat(3, minmax(180px, 1fr)) auto;
  gap: 12px;
  align-items: end;
}

.acoes-filtro { display: flex; gap: 8px; }

.resumo-tabela {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  margin: 0 2px 10px;
  font-size: 13px;
}

.resumo-direita { margin-left: auto; }
.segmentado .numero { color: var(--text-support); font-weight: 500; margin-left: 2px; }

/* tabela ocupa a altura disponível, com rolagem própria e cabeçalho fixo */
.tabela-tela { max-height: calc(100vh - 290px); min-height: 220px; }
.tabela-tela .vazio { padding: 40px 20px; }

.tabela td.celula-status { white-space: nowrap; }
.tabela td.mono { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; }
.tabela td.numero { font-variant-numeric: tabular-nums; }

/* coluna "Histórico": fica presa à direita quando a tabela rola na horizontal */
.tabela .col-acoes { position: sticky; right: 0; width: 1%; padding: 4px 12px; text-align: center; background: var(--bg-card); box-shadow: inset 1px 0 0 var(--border-color); }
.tabela th.col-acoes { z-index: 2; background: var(--bg-subtle); padding: 10px 12px; }
.tabela tbody tr:hover td.col-acoes { background: var(--table-hover); }
.btn-linha { width: 32px; height: 32px; padding: 0; color: var(--text-support); }
.btn-linha:hover { color: var(--brand-accent); border-color: var(--brand-accent); }
.btn-linha .icone { width: 16px; height: 16px; }

.mais-linhas { display: flex; justify-content: center; margin-top: 12px; }

/* telas médias: pesquisa + botões na 1ª linha, os três filtros na 2ª */
@media (max-width: 1400px) {
  .barra-filtros { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "busca busca acoes"; }
  .campo-busca { grid-area: busca; }
  .acoes-filtro { grid-area: acoes; justify-content: flex-end; }
}

@media (max-width: 600px) {
  .barra-filtros { grid-template-columns: 1fr; grid-template-areas: none; }
  .campo-busca, .acoes-filtro { grid-area: auto; }
  .acoes-filtro .btn { flex: 1; }
  .tabela-tela { max-height: none; }
}
</style>
