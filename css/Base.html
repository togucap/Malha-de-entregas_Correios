<style>
/*
 * Base: tipografia, layout geral (barra lateral + área principal), scrollbar e responsivo.
 * Só usa os tokens de css/Tokens.
 */

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  display: flex;
  height: 100vh;
  overflow: hidden;
  background: var(--bg-global);
  color: var(--text-main);
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p { margin: 0; }

/* códigos e identificadores (etiquetas, pedidos, NF, lotes, horas em listas) */
.mono, code {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 600;
}

.texto-apoio { color: var(--text-support); }
.numero { font-variant-numeric: tabular-nums; }

.rotulo-secao {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-support);
}

:focus-visible {
  outline: 2px solid var(--brand-accent);
  outline-offset: 2px;
}

/* ---------- Barra lateral ---------- */

.sidebar {
  flex: 0 0 240px;
  width: 240px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 20px 14px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  overflow-y: auto;
}

.marca {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 4px;
}

.marca-icone {
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--brand-accent);
  color: var(--on-brand);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
}

.marca-nome { font-size: 14px; font-weight: 700; }
.marca-sub { font-size: 12px; color: var(--text-support); }

.nav-bloco { display: flex; flex-direction: column; gap: 2px; }
.nav-bloco .rotulo-secao { padding: 0 10px 6px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 40px;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-support);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.nav-item:hover { background: var(--bg-elevated); color: var(--text-main); }

.nav-item.ativo {
  background: var(--bg-elevated);
  color: var(--text-main);
  font-weight: 600;
}

.nav-item.ativo .icone { color: var(--brand-accent); }

/* ícones em traço (estilo Lucide/Feather) */
.icone {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icone[hidden] { display: none; }

/* ---------- Área principal ---------- */

.principal {
  flex: 1 1 auto;
  min-width: 0;
  overflow-y: auto;
  padding: 22px 28px 40px;
}

.cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.titulo-pagina {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.subtitulo-pagina { font-size: 13px; color: var(--text-support); margin-top: 2px; }

.vista[hidden] { display: none; }

/* ---------- Scrollbar ---------- */

* { scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-bg); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 5px;
  border: 2px solid var(--scrollbar-bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--text-support); }

/* ---------- Responsivo ---------- */

/* telas estreitas: barra lateral só com ícones */
@media (max-width: 900px) {
  .sidebar { flex-basis: 64px; width: 64px; padding: 20px 10px; align-items: center; }
  .marca { padding: 0; }
  .marca-texto, .nav-texto, .nav-bloco .rotulo-secao { display: none; }
  .nav-item { justify-content: center; width: 44px; padding: 8px; }
}

@media (max-width: 600px) {
  .sidebar { flex-basis: 56px; width: 56px; padding: 16px 6px; }
  .principal { padding: 16px 16px 32px; }
  .titulo-pagina { font-size: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
