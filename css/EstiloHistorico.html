<style>
/* Janela "Histórico de rastreio" (html/ModalHistorico). Só tokens. */

.modal-historico {
  max-width: 680px;
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}

.historico-topo { padding: 18px 64px 0 20px; }
.historico-titulo { margin: 0; font-size: 17px; font-weight: 600; }
.historico-topo .texto-apoio { margin: 4px 0 0; }

.historico-busca { padding: 14px 20px 16px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; }
.historico-busca-linha { display: flex; gap: 8px; }
.historico-busca-linha .input { flex: 1 1 auto; min-width: 0; }
.historico-nota { margin: 2px 0 0; font-size: 12px; color: var(--text-support); }

/* só o corpo rola; busca e título ficam fixos */
.historico-corpo { padding: 16px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

.historico-carregando { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
@keyframes historico-carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.historico-progresso { width: 40%; animation: historico-carga 1.1s ease-in-out infinite; }

#historicoAvisos { display: flex; flex-direction: column; gap: 8px; }
#historicoAvisos:empty { display: none; }

/* cartão do objeto: código grande + status */
.historico-objeto {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px 20px;
  padding: 16px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background: var(--bg-subtle);
}

.historico-objeto-info { min-width: 0; }
.historico-rotulo { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-support); }
.historico-codigo { font-size: 22px; line-height: 1.3; margin: 2px 0 4px; word-break: break-all; }
.historico-objeto-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
.historico-objeto-status .texto-apoio { font-size: 12px; }

.historico-secao { margin: 8px 0 0; font-size: 14px; font-weight: 600; }

/* linha do tempo vertical: bolinha + traço ligando os eventos */
.linha-tempo { list-style: none; margin: 0; padding: 0; }

.linha-tempo > li {
  position: relative;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 12px;
  padding-bottom: 18px;
}

.linha-tempo > li:last-child { padding-bottom: 0; }

/* traço entre as bolinhas */
.linha-tempo > li:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 15px;
  top: 34px;
  bottom: 2px;
  width: 2px;
  border-radius: 1px;
  background: var(--border-color);
}

.evento-marca {
  width: 32px;
  height: 32px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  color: var(--text-support);
}

.evento-marca .icone { width: 16px; height: 16px; }

/* evento mais recente em destaque, na cor do status (mesmas cores dos chips) */
.evento-marca.chip-marca { color: var(--brand-accent); background: var(--brand-soft); border-color: currentColor; }
.evento-marca.chip-sucesso { color: var(--emerald); background: var(--emerald-soft); border-color: currentColor; }
.evento-marca.chip-erro { color: var(--red-alert); background: var(--red-soft); border-color: currentColor; }
.evento-marca.chip-neutro { color: var(--text-main); background: var(--neutral-soft); border-color: var(--text-support); }
.linha-tempo > li.atual .evento-titulo { color: var(--text-main); }

.evento-titulo { font-weight: 600; font-size: 14px; line-height: 1.4; padding-top: 5px; }
.evento-detalhe { font-size: 13px; color: var(--text-support); margin-top: 2px; }
.evento-local { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; margin-top: 4px; color: var(--text-main); }
.evento-local .icone { width: 14px; height: 14px; margin-top: 2px; color: var(--text-support); }
.evento-local b { font-weight: 600; color: var(--text-support); }
.evento-data { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; color: var(--text-support); margin-top: 6px; font-variant-numeric: tabular-nums; }

@media (max-width: 600px) {
  .modal-fundo { padding: 8px; }
  .modal-historico { max-height: calc(100vh - 16px); }
  .historico-topo { padding: 16px 60px 0 16px; }
  .historico-busca, .historico-corpo { padding-left: 16px; padding-right: 16px; }
  .historico-busca-linha .btn span { display: none; }
  .historico-codigo { font-size: 18px; }
  .historico-objeto-status { align-items: flex-start; text-align: left; }
}
</style>
