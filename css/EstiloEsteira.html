<style>
/*
 * Esteira de execuções (js/Esteira): cena em SVG da cadeia protocolos → relatórios → tracking → JSON
 * e a trilha de etapas abaixo dela. Só tokens (cores da cena em css/Tokens: --esteira-*, --caixa-*, --operador).
 */

.esteira-rolagem { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-subtle); }
.esteira-cena { display: block; width: 100%; min-width: 760px; height: auto; }

/* chão, esteiras e suportes */
.es-chao { stroke: var(--esteira-chao); stroke-width: 2; }
.es-suporte { fill: var(--esteira-rolo); }
.es-lona { fill: var(--esteira-lona); }
.es-marca { stroke: var(--esteira-marca); stroke-width: 3; stroke-linecap: round; fill: none; }
.es-rolo { fill: var(--esteira-rolo); stroke: var(--esteira-lona); stroke-width: 2; }

/* polos */
.es-cupula { fill: var(--esteira-metal); stroke: var(--border-strong); stroke-width: 3; }
.es-base { fill: var(--esteira-metal-claro); stroke: var(--border-strong); stroke-width: 2; }
.es-pe { fill: var(--esteira-rolo); }
.es-boca { fill: var(--esteira-boca); }
.es-aro { fill: var(--esteira-metal-claro); stroke: var(--border-strong); stroke-width: 3; }
.es-visor { fill: var(--bg-subtle); stroke: var(--border-strong); stroke-width: 2; }
.es-pct { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; fill: var(--text-main); }
.es-placa { fill: var(--bg-elevated); stroke: var(--border-strong); stroke-width: 1.5; }
.es-placa-txt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.06em; fill: var(--text-support); }
.es-sinal { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 18px; fill: var(--bg-global); }
.es-calha { fill: var(--esteira-metal); stroke: var(--border-strong); stroke-width: 2; }

/* luz da escotilha e nível do visor pela cor do estado */
.es-luz, .es-halo { fill: var(--bg-elevated); }
[data-estado="ok"] > .es-luz, [data-estado="ok"] > .es-halo { fill: var(--emerald); }
[data-estado="executando"] > .es-luz, [data-estado="executando"] > .es-halo,
[data-estado="aguardando"] > .es-luz { fill: var(--brand-accent); }
[data-estado="agendado"] > .es-luz, [data-estado="agendado"] > .es-halo { fill: var(--blue); }
[data-estado="alerta"] > .es-luz, [data-estado="alerta"] > .es-halo { fill: var(--violet); }
[data-estado="erro"] > .es-luz, [data-estado="erro"] > .es-halo { fill: var(--red-alert); }
.es-nivel { fill: var(--brand-soft); }
[data-estado="ok"] > .es-nivel { fill: var(--emerald-soft); }
[data-estado="alerta"] > .es-nivel { fill: var(--violet-soft); }
[data-estado="erro"] > .es-nivel { fill: var(--red-soft); }

/* caixas, operador e doca */
.es-cx-frente { fill: var(--caixa-frente); stroke: var(--caixa-fita); stroke-width: 1.2; }
.es-cx-topo { fill: var(--caixa-topo); stroke: var(--caixa-fita); stroke-width: 1.2; }
.es-cx-lado { fill: var(--caixa-lado); stroke: var(--caixa-fita); stroke-width: 1.2; }
.es-cx-fita { stroke: var(--caixa-fita); stroke-width: 1.2; }
.es-op { stroke: var(--operador); stroke-width: 4; stroke-linecap: round; fill: none; }
.es-op-cabeca { fill: var(--operador); }
.es-capacete { fill: var(--brand-accent); }
.es-palete { fill: var(--esteira-rolo); }
.es-doc { fill: var(--bg-card); stroke: var(--border-strong); stroke-width: 2; }
.es-doc-txt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 11px; fill: var(--text-support); }

/* trilha de etapas abaixo da cena */
.esteira-trilha { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.esteira-trilha li { display: flex; gap: 10px; align-items: flex-start; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-subtle); }
.esteira-trilha li.atual { border-color: var(--brand-accent); }
.esteira-trilha .luz { width: 22px; height: 22px; }
.trilha-texto { min-width: 0; }
.trilha-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.trilha-nome { font-weight: 600; }
.trilha-detalhe { font-size: 12px; color: var(--text-support); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

@media (max-width: 900px) { .esteira-trilha { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .esteira-trilha { grid-template-columns: 1fr; } }
</style>
