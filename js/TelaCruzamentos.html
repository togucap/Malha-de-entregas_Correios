<script>
/*
 * Vista "Cruzamentos": painel de execuções. Lê statusExecucoes() (gs/StatusExecucoes) e acende as luzes.
 * - Relê sozinho enquanto a vista estiver aberta e a aba do navegador visível:
 *   a cada 10 s se algo estiver em andamento, senão a cada 60 s.
 * - Botões chamam acaoPainel(acao) (gs/Cadeia): cadeia, tracking e relatórios entram na fila
 *   (começam em ~1 min); o JSON é gerado na hora.
 */
(function () {
  var VISTA = 'cruzamentos';
  var RAPIDO = 10000, LENTO = 60000;

  var ROTULOS = {
    '': 'Sem registro', agendado: 'Na fila', executando: 'Em execução', aguardando: 'Aguardando continuação',
    ok: 'Concluído', alerta: 'Atenção', erro: 'Erro', parado: 'Cancelado'
  };
  var CHIPS = {
    '': 'chip-neutro', parado: 'chip-neutro', agendado: 'chip-info', executando: 'chip-marca', aguardando: 'chip-marca',
    ok: 'chip-sucesso', alerta: 'chip-divergencia', erro: 'chip-erro'
  };
  var ORIGENS = { menu: 'pelo menu', gatilho: 'por acionador', cadeia: 'pela cadeia', painel: 'pelo painel', editor: 'pelo editor', tracking: 'no fim do tracking' };
  var NOMES_ETAPA = { importacao: 'Protocolos', cruzamentos: 'Relatórios do Drive', tracking: 'Tracking', concluida: 'Concluída' };

  var estado = { dados: null, espera: null, carregando: false, defasagem: 0 };

  function $(id) { return document.getElementById(id); }
  function visivel() { var v = document.querySelector('.vista[data-vista="' + VISTA + '"]'); return v && !v.hidden && !document.hidden; }
  function numero(n) { return Number(n || 0).toLocaleString('pt-BR'); }
  function luz(el, e) { el.setAttribute('data-estado', e || ''); }
  function chip(el, e, texto) { el.className = 'chip ' + (CHIPS[e || ''] || 'chip-neutro'); el.textContent = texto || ROTULOS[e || ''] || e; }
  function origem(o) { return o ? ORIGENS[o] || o : ''; }

  // "há 12 min" pelo relógio do servidor (corrige a diferença com o relógio do navegador)
  function ha(ms) {
    if (!ms) return '';
    var s = Math.max(0, Math.round((Date.now() + estado.defasagem - ms) / 1000));
    if (s < 60) return 'agora';
    var m = Math.round(s / 60);
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.floor(m / 60);
    if (h < 24) return 'há ' + h + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
    return 'há ' + Math.floor(h / 24) + ' dia(s)';
  }
  function quando(ms, texto) { return ms ? texto + ' (' + ha(ms) + ')' : '—'; }
  function curto(texto) { return String(texto || '').slice(0, 16).replace(/^(\d{2}\/\d{2})\/\d{4}/, '$1'); } // "23/11 14:02"

  /* ---------- Leitura ---------- */

  function carregar() {
    clearTimeout(estado.espera);
    if (estado.carregando) return;
    if (!window.google || !google.script || !google.script.run) {
      avisar('Abra o painel pelo Apps Script (menu Correios › Abrir painel ou App da Web).', true);
      return;
    }
    estado.carregando = true;
    google.script.run.withSuccessHandler(receber).withFailureHandler(function (e) {
      estado.carregando = false;
      avisar('Não foi possível ler o status: ' + (e && e.message ? e.message : e), true);
      agendar(LENTO);
    }).statusExecucoes();
  }

  function agendar(ms) {
    clearTimeout(estado.espera);
    estado.espera = setTimeout(function () { if (visivel()) carregar(); }, ms);
  }

  function receber(d) {
    estado.carregando = false;
    estado.dados = d;
    estado.defasagem = d.agora - Date.now();
    desenhar();
    agendar(d.emAndamento ? RAPIDO : LENTO);
  }

  function avisar(texto, erro) {
    var a = $('avisoPainel');
    a.textContent = texto;
    a.className = 'aviso ' + (erro ? 'aviso-perigo' : 'aviso-info');
    a.hidden = !texto;
  }

  /* ---------- Desenho ---------- */

  function desenhar() {
    var p = estado.dados.processos;
    desenharGeral(p);
    desenharCadeia(p);
    desenharTracking(p.tracking);
    desenharAcionadores(estado.dados.acionadores);
    $('painelLido').textContent = 'Status lido em ' + estado.dados.agoraTexto + ' · relê sozinho a cada ' +
      (estado.dados.emAndamento ? '10 s (há execução em andamento)' : '1 min');
  }

  // luz grande: erro > em andamento > atenção > ok
  function desenharGeral(p) {
    var nomes = { importacao: 'Protocolos', cruzamentos: 'Relatórios do Drive', tracking: 'Tracking', json: 'Payload_Tracking', cadeia: 'Cadeia' };
    var chaves = Object.keys(nomes);
    var com = function (lista) { return chaves.filter(function (k) { return lista.indexOf(p[k].estado) >= 0; }); };
    var erros = com(['erro']), andamento = com(['executando', 'aguardando', 'agendado']), alertas = com(['alerta']);
    var e, titulo;
    if (erros.length) { e = 'erro'; titulo = 'Erro em: ' + erros.map(function (k) { return nomes[k]; }).join(', '); }
    else if (andamento.length) { e = 'executando'; titulo = 'Em andamento: ' + andamento.map(function (k) { return nomes[k]; }).join(', '); }
    else if (alertas.length) { e = 'alerta'; titulo = 'Atenção em: ' + alertas.map(function (k) { return nomes[k]; }).join(', '); }
    else if (p.tracking.ultimaConclusao) { e = 'ok'; titulo = 'Tudo em dia'; }
    else { e = ''; titulo = 'Nenhuma execução registrada ainda'; }
    luz($('geralLuz'), e);
    $('geralTitulo').textContent = titulo;
    $('geralTexto').textContent = p.tracking.ultimaConclusao
      ? 'Tracking atualizado em ' + p.tracking.ultimaConclusaoTexto + ' (' + ha(p.tracking.ultimaConclusao) + ')'
      : 'O tracking ainda não terminou nenhum ciclo com o painel ativo.';
  }

  function desenharCadeia(p) {
    var c = p.cadeia;
    // agência de triagem, equipe, ficha e malotes (js/Agencia)
    if (window.Agencia) Agencia.atualizar(estado.dados);
    chip($('cadeiaChip'), c.estado, c.estado === 'executando' ? 'Em andamento · ' + (NOMES_ETAPA[c.etapa] || c.etapa) : null);
    $('cadeiaInfo').textContent = c.inicio
      ? 'Última cadeia: iniciada em ' + c.inicioTexto + ' ' + origem(c.origem) +
        (c.fim ? ', terminada em ' + c.fimTexto : '') + '. ' + (c.mensagem || '')
      : 'Nenhuma cadeia executada ainda. Ela começa pelo botão "Executar cadeia completa", pelo menu Correios › "Importar protocolos e atualizar tudo" ou por um acionador de executarCadeiaCompleta.';
  }

  function desenharTracking(t) {
    luz($('trackingLuz'), t.estado);
    chip($('trackingChip'), t.estado, t.estado === 'alerta' && t.proxima ? 'Nova tentativa agendada' : null);

    var prog = t.progresso || { feitas: 0, restantes: 0 };
    var total = (prog.feitas || 0) + (prog.restantes || 0);
    var pct = total ? Math.round(prog.feitas / total * 100) : (t.estado === 'ok' ? 100 : 0);
    var barra = $('trackingBarra');
    barra.style.width = pct + '%';
    barra.classList.toggle('concluido', t.estado === 'ok');
    $('trackingContagem').textContent = total
      ? numero(prog.feitas) + ' de ' + numero(total) + ' linha(s) consultada(s) no ciclo'
      : (t.estado ? 'Nenhuma linha pendente no ciclo' : 'Sem ciclo registrado');
    $('trackingPct').textContent = total ? pct + '%' : '';

    $('trackingConclusao').textContent = quando(t.ultimaConclusao, t.ultimaConclusaoTexto);
    $('trackingCiclo').textContent = t.ciclo && t.ciclo.inicio
      ? 'Iniciado em ' + t.ciclo.inicioTexto + ' ' + origem(t.ciclo.origem) + (t.ciclo.reprocessar ? ' (reprocessar todas)' : '')
      : '—';
    $('trackingExecucao').textContent = t.execucaoFim ? 'Terminou ' + ha(t.execucaoFim) + ' (' + curto(t.execucaoFimTexto) + ')'
      : t.execucaoInicio ? 'Começou ' + ha(t.execucaoInicio) : '—';
    $('trackingProxima').textContent = t.proxima ? '~' + t.proximaTexto.slice(11) : '—';
    $('trackingMensagem').textContent = t.mensagem || '';
  }

  function desenharAcionadores(lista) {
    var ul = $('listaAcionadores');
    if (!lista || !lista.length) {
      ul.innerHTML = '<li><span class="texto-apoio">Nenhum acionador no projeto (para a conta que abriu o painel).</span></li>';
      return;
    }
    ul.innerHTML = lista.map(function (a) {
      var tipo = a.tipo === 'CLOCK' ? 'tempo' : a.tipo === 'ON_OPEN' ? 'ao abrir' : a.tipo.toLowerCase();
      return '<li><span>' + escapar(a.rotulo) + '</span><span class="qtd">' + escapar(tipo) + (a.qtd > 1 ? ' ×' + a.qtd : '') + '</span></li>';
    }).join('');
  }

  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- Ações ---------- */

  function executar(acao, botao) {
    if (!window.google || !google.script || !google.script.run) return;
    document.querySelectorAll('[data-acao-painel]').forEach(function (b) { b.disabled = true; });
    avisar(acao === 'json' ? 'Gerando o Payload_Tracking…' : 'Enviando o pedido…');
    var pronto = function () { document.querySelectorAll('[data-acao-painel]').forEach(function (b) { b.disabled = false; }); };
    google.script.run.withSuccessHandler(function (msg) {
      pronto();
      avisar(msg);
      carregar();
    }).withFailureHandler(function (e) {
      pronto();
      avisar(e && e.message ? e.message : String(e), true);
      carregar();
    }).acaoPainel(acao);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-acao-painel]').forEach(function (b) {
      b.addEventListener('click', function () { executar(b.getAttribute('data-acao-painel'), b); });
    });
    $('recarregarPainel').addEventListener('click', carregar);
  });

  // lê ao abrir a vista e ao voltar para a aba do navegador
  document.addEventListener('vistamostrada', function (e) { if (e.detail === VISTA) carregar(); });
  document.addEventListener('visibilitychange', function () { if (visivel()) carregar(); });
})();
</script>
