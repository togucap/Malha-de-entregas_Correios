<script>
/*
 * Tela "Acompanhamento - OUT": carrega dadosAcompanhamentoOut() na primeira vez que a tela é aberta;
 * visão, pesquisa e filtros rodam no navegador. Mostra 500 linhas por vez ("Mostrar mais").
 *
 * - Visão "Em aberto" (padrão) = status ainda consultado pelas APIs; "Finalizado" = status final
 *   (mesma regra da atualização, calculada no servidor). Nenhuma linha é descartada: só muda a visão.
 * - Pesquisa: com termo, mostra os resultados das duas visões (em aberto e finalizados) juntos;
 *   cada botão da visão mostra quantos resultados tem com a pesquisa e os filtros atuais.
 * - Filtros: js/FiltroMultiplo (seleção múltipla; nenhum marcado = todos). As opções de cada filtro
 *   vêm das linhas da visão atual (com pesquisa, das duas). Toda mudança chama aplicarFiltrosGlobais().
 * - Última coluna: botão "Histórico" (js/HistoricoTracking) com o Código convertido ou, se vazio,
 *   a Autorização Postagem da linha.
 */
(function () {
  var VISTA = 'acompanhamento-out';
  var POR_PAGINA = 500;
  // colunas pesquisadas pelo campo de busca
  var BUSCA = ['Pedido', 'Autorização Postagem', 'Código convertido', 'Parceiro_Nome', 'Pedido_Parceiro'];
  // códigos e identificadores em fonte mono
  var MONO = ['Protocolo', 'Pedido', 'Autorização Postagem', 'Código convertido', 'Pedido_Parceiro'];
  var VAZIO = '__vazio__';
  // colunas Sim/Não em chip (Sim = verde, Não = neutro)
  var SIM_NAO = ['Entrada_Lista', 'Assistencia_Tecnica'];

  var estado = { carregado: false, colunas: [], linhas: [], visao: 'aberto', pesquisando: false, filtradas: [], naOutraVisao: 0, limite: POR_PAGINA };

  function $(id) { return document.getElementById(id); }

  function normalizar(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }

  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function indice(coluna) { return estado.colunas.indexOf(coluna); }
  function filtros() { return Array.prototype.slice.call(document.querySelectorAll('[data-vista="' + VISTA + '"] [data-filtro-multiplo]')); }
  function naVisao(l) { return estado.visao === 'finalizado' ? l.finalizada : !l.finalizada; }
  // linhas consideradas: as da visão atual; com pesquisa, as das duas visões
  function noEscopo(l) { return estado.pesquisando || naVisao(l); }
  function termoBusca() { return normalizar($('buscaOut').value); }

  /* ---------- Carregamento ---------- */

  function carregar() {
    estado.carregado = true;
    $('avisoOut').hidden = true;
    $('infoOut').textContent = 'Carregando…';
    $('atualizarOut').disabled = true;
    if (!window.google || !google.script || !google.script.run) {
      falhar({ message: 'Abra o painel pelo Apps Script (menu Correios › Abrir painel ou App da Web).' });
      return;
    }
    google.script.run.withSuccessHandler(receber).withFailureHandler(falhar).dadosAcompanhamentoOut();
  }

  function receber(d) {
    $('atualizarOut').disabled = false;
    estado.colunas = d.colunas;          // nomes na base (usados para achar as colunas)
    estado.rotulos = d.rotulos || d.colunas; // títulos do cabeçalho
    var busca = BUSCA.map(indice);
    estado.linhas = d.linhas.map(function (v, k) {
      return { v: v, finalizada: !!(d.finalizadas && d.finalizadas[k]), busca: normalizar(busca.map(function (i) { return v[i]; }).join(' ')) };
    });
    $('atualizadoOut').textContent = 'Base lida em ' + d.atualizadoEm;
    estado.pesquisando = !!termoBusca();
    if (d.faltando && d.faltando.length) {
      avisar('Colunas não encontradas na base: ' + d.faltando.join(', ') + '. Elas aparecem vazias.');
    }
    montarCabecalho();
    montarFiltros();
    aplicar();
  }

  function falhar(e) {
    $('atualizarOut').disabled = false;
    $('infoOut').textContent = '';
    avisar('Não foi possível ler a base: ' + (e && e.message ? e.message : e));
  }

  function avisar(texto) {
    var aviso = $('avisoOut');
    aviso.textContent = texto;
    aviso.hidden = false;
  }

  /* ---------- Filtros ---------- */

  // opções de cada filtro: valores distintos das linhas no escopo (visão atual ou, com pesquisa, as duas)
  function montarFiltros() {
    filtros().forEach(function (raiz) {
      var i = indice(raiz.getAttribute('data-coluna'));
      var contagem = {};
      estado.linhas.forEach(function (l) {
        if (!noEscopo(l)) return;
        var v = i < 0 ? '' : l.v[i];
        var chave = v === '' ? VAZIO : v;
        contagem[chave] = (contagem[chave] || 0) + 1;
      });
      var opcoes = Object.keys(contagem).sort(function (a, b) {
        if (a === VAZIO) return 1;
        if (b === VAZIO) return -1;
        return a.localeCompare(b, 'pt-BR');
      }).map(function (v) {
        return { valor: v, rotulo: v === VAZIO ? '(vazio)' : v, qtd: contagem[v] };
      });
      FiltroMultiplo.preencher(raiz, opcoes);
    });
  }

  // linha passa na pesquisa e nos filtros marcados (independente da visão)
  function criterios() {
    var termo = termoBusca();
    var ativos = filtros().map(function (raiz) {
      var marcados = FiltroMultiplo.selecionados(raiz);
      var conjunto = {};
      marcados.forEach(function (v) { conjunto[v === VAZIO ? '' : v] = true; });
      return { i: indice(raiz.getAttribute('data-coluna')), conjunto: conjunto, vazio: !marcados.length };
    }).filter(function (f) { return !f.vazio; });

    return function (l) {
      if (termo && l.busca.indexOf(termo) < 0) return false;
      for (var k = 0; k < ativos.length; k++) {
        if (!ativos[k].conjunto[ativos[k].i < 0 ? '' : l.v[ativos[k].i]]) return false;
      }
      return true;
    };
  }

  // chamada pelos filtros (data-ao-mudar), pela pesquisa e pela troca de visão
  function aplicar() {
    var pesquisando = !!termoBusca();
    if (pesquisando !== estado.pesquisando) {
      estado.pesquisando = pesquisando;
      montarFiltros(); // pesquisa liga/desliga: opções passam a vir das duas visões (ou só da atual)
    }
    var passa = criterios();
    var abertos = 0, finalizados = 0;
    estado.filtradas = [];
    estado.linhas.forEach(function (l) {
      if (!passa(l)) return;
      if (l.finalizada) finalizados++; else abertos++;
      if (noEscopo(l)) estado.filtradas.push(l);
    });
    $('qtdAbertoOut').textContent = abertos.toLocaleString('pt-BR');
    $('qtdFinalizadoOut').textContent = finalizados.toLocaleString('pt-BR');
    estado.limite = POR_PAGINA;
    estado.naOutraVisao = estado.pesquisando ? 0 : estado.visao === 'aberto' ? finalizados : abertos;
    estado.qtd = { abertos: abertos, finalizados: finalizados };
    desenharLinhas();
  }
  window.aplicarFiltrosGlobais = aplicar;

  function trocarVisao(visao) {
    if (visao === estado.visao) return;
    estado.visao = visao;
    document.querySelectorAll('[data-vista="' + VISTA + '"] [data-visao]').forEach(function (b) {
      var ativo = b.getAttribute('data-visao') === visao;
      b.classList.toggle('ativo', ativo);
      b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
    });
    montarFiltros(); // opções e contagens da nova visão (marcações que existirem continuam)
    aplicar();
  }

  /* ---------- Tabela ---------- */

  function montarCabecalho() {
    $('tabelaOut').tHead.innerHTML = '<tr>' + estado.rotulos.map(function (c) {
      return '<th scope="col">' + escapar(c) + '</th>';
    }).join('') + '<th scope="col" class="col-acoes">Histórico</th></tr>';
  }

  // código usado no histórico: Código convertido (rastreio) ou, se vazio, a Autorização Postagem
  function codigoHistorico(l) {
    var conv = indice('Código convertido'), aut = indice('Autorização Postagem');
    return String((conv >= 0 && l.v[conv]) || (aut >= 0 && l.v[aut]) || '').trim();
  }

  function botaoHistorico(l, k) {
    if (!codigoHistorico(l)) return '<td class="col-acoes"></td>';
    var pedido = indice('Pedido') >= 0 ? l.v[indice('Pedido')] : '';
    return '<td class="col-acoes"><button type="button" class="btn btn-fantasma btn-linha" data-historico="' + k + '"' +
      ' title="Histórico de rastreio" aria-label="Histórico de rastreio' + (pedido ? ' do pedido ' + escapar(pedido) : '') + '">' +
      '<svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button></td>';
  }

  function abrirHistorico(k, botao) {
    var l = estado.filtradas[k];
    if (!l) return;
    var valor = function (c) { var i = indice(c); return i >= 0 ? l.v[i] : ''; };
    var contexto = [['Pedido', valor('Pedido')], ['Protocolo', valor('Protocolo')], ['Parceiro', valor('Parceiro_Nome')]]
      .filter(function (p) { return p[1]; }).map(function (p) { return p[0] + ' ' + p[1]; }).join(' · ');
    HistoricoTracking.abrir({ codigo: codigoHistorico(l), protocolo: valor('Protocolo'), autorizacao: valor('Autorização Postagem'),
      contexto: contexto, origem: botao });
  }

  function celula(coluna, valor) {
    if (coluna === 'Status tracking') {
      return '<td>' + (valor ? '<span class="chip ' + window.classeStatus(valor) + '">' + escapar(valor) + '</span>' : '') + '</td>';
    }
    if (SIM_NAO.indexOf(coluna) >= 0 && valor) {
      return '<td><span class="chip ' + (normalizar(valor) === 'sim' ? 'chip-sucesso' : 'chip-neutro') + '">' + escapar(valor) + '</span></td>';
    }
    var classe = MONO.indexOf(coluna) >= 0 ? ' class="mono"' : /^Dt\.|^Data/.test(coluna) ? ' class="numero"' : '';
    return '<td' + classe + '>' + escapar(valor) + '</td>';
  }

  function desenharLinhas() {
    var naOutraVisao = estado.naOutraVisao; // resultados da pesquisa/filtros na visão que não está aberta
    var visiveis = estado.filtradas.slice(0, estado.limite);
    $('tabelaOut').tBodies[0].innerHTML = visiveis.map(function (l, k) {
      return '<tr>' + estado.colunas.map(function (c, i) { return celula(c, l.v[i]); }).join('') + botaoHistorico(l, k) + '</tr>';
    }).join('');

    var achadas = estado.filtradas.length;
    var nomeVisao = estado.visao === 'aberto' ? 'em aberto' : 'finalizado(s)';
    var outra = estado.visao === 'aberto' ? 'Finalizado' : 'Em aberto';
    $('vazioOut').hidden = achadas > 0;
    $('tabelaOut').hidden = achadas === 0;
    $('vazioTextoOut').textContent = naOutraVisao
      ? naOutraVisao.toLocaleString('pt-BR') + ' resultado(s) na visão "' + outra + '".'
      : 'Ajuste a pesquisa ou os filtros.';
    var descricao = estado.pesquisando
      ? ' na pesquisa (' + estado.qtd.abertos.toLocaleString('pt-BR') + ' em aberto, ' +
        estado.qtd.finalizados.toLocaleString('pt-BR') + ' finalizado(s))'
      : ' ' + nomeVisao;
    $('infoOut').textContent = achadas.toLocaleString('pt-BR') + ' protocolo(s)' + descricao +
      (achadas > visiveis.length ? ' · mostrando ' + visiveis.length.toLocaleString('pt-BR') : '');
    $('maisOut').hidden = achadas <= visiveis.length;
  }

  /* ---------- Eventos ---------- */

  var espera;
  document.addEventListener('DOMContentLoaded', function () {
    $('buscaOut').addEventListener('input', function () { clearTimeout(espera); espera = setTimeout(aplicar, 150); });
    document.querySelectorAll('[data-vista="' + VISTA + '"] [data-visao]').forEach(function (b) {
      b.addEventListener('click', function () { trocarVisao(b.getAttribute('data-visao')); });
    });
    $('limparOut').addEventListener('click', function () {
      $('buscaOut').value = '';
      filtros().forEach(FiltroMultiplo.limpar);
      aplicar();
    });
    $('atualizarOut').addEventListener('click', carregar);
    $('maisOut').addEventListener('click', function () { estado.limite += POR_PAGINA; desenharLinhas(); });
    // botão "Histórico" de cada linha (delegação: as linhas são redesenhadas a cada filtro)
    $('tabelaOut').tBodies[0].addEventListener('click', function (e) {
      var botao = e.target.closest('[data-historico]');
      if (botao) abrirHistorico(Number(botao.getAttribute('data-historico')), botao);
    });
  });

  // carrega na primeira vez que a tela é aberta (evento disparado por js/Navegacao)
  document.addEventListener('vistamostrada', function (e) {
    if (e.detail === VISTA && !estado.carregado) carregar();
  });
})();
</script>
