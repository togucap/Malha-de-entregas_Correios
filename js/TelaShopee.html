<script>
/*
 * Vista "Shopee": quadro kanban. Dados de js/DadosPainel (telaShopee: Painel_JSON + alterações, regras de gs/Shopee).
 * - Pendente de atendimento: cartões da aba Retorno_Extensão (título Pedido_Shopee; Pedido, prazo, statusSolicitacao).
 * - Em transporte, Entregue e Finalizados: cartões da aba base (título Pedido_Parceiro; Pedido, Status tracking,
 *   Assistência técnica Sim/Não, Entrada_Lista).
 * - Filtros FiltroMultiplo (data-campo = campo do cartão; cartão sem o campo conta como "(vazio)"):
 *   Status tracking, statusSolicitacao, prazo, Entrada_Lista, Assistência técnica. Opções = valores dos cartões
 *   que passam na pesquisa, com contagem. Mudança chama aplicarFiltrosShopee.
 * - Dados: cópia no navegador conferida a cada 30 s (js/DadosPainel); toda mudança redesenha mantendo pesquisa,
 *   filtros e "Mostrar mais"; "Atualizar" confere na hora. Finalizados com mais de 25 dias só no total da coluna.
 * - Clique no cartão: janela com os dados de tracking (Data Ocorrencia, cidade, Data Prevista Entrega) e o
 *   botão "Consultar tracking em tempo real", que abre a janela de histórico (js/HistoricoTracking).
 * - Pesquisa no navegador (sem acento/maiúsculas, parte do texto) no título e no Pedido; 50 cartões por coluna.
 * Depende de js/StatusVisual (window.classeStatus) e js/HistoricoTracking.
 */
(function () {
  var VISTA = 'shopee';
  var POR_VEZ = 50;
  var VAZIO = '\u0000vazio';
  var estado = { dados: null, carregado: false, carregando: false, limite: {}, aberto: null, origem: null };

  var RELOGIO = '<svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  function $(id) { return document.getElementById(id); }
  function numero(n) { return Number(n || 0).toLocaleString('pt-BR'); }
  function normalizar(v) {
    return String(v == null ? '' : v).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }
  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function chipSimNao(v) { return normalizar(v) === 'sim' ? 'chip-sucesso' : 'chip-neutro'; }
  function corStatus(s) { return window.classeStatus ? window.classeStatus(s) : 'chip-neutro'; }

  function avisar(texto) {
    var a = $('avisoShopee');
    a.textContent = texto || '';
    a.hidden = !texto;
  }

  /* ---------- Leitura ---------- */

  function filtros() { return Array.prototype.slice.call(document.querySelectorAll('[data-vista="' + VISTA + '"] [data-filtro-multiplo]')); }
  function valorCampo(c, campo) { var v = c[campo]; return v == null ? '' : String(v); }

  // botão Atualizar: confere com o servidor agora
  function carregar() {
    if (window.DadosPainel) DadosPainel.atualizar();
  }

  // avisos de js/DadosPainel: dados novos redesenham; os demais só atualizam o estado da leitura
  function ouvir(motivo) {
    var st = DadosPainel.estado();
    $('atualizarShopee').disabled = st.carregando;
    $('atualizadoShopee').textContent = DadosPainel.textoAtualizacao();
    if ((motivo === 'local' || motivo === 'dados') && st.pronto) receber(DadosPainel.telaShopee(), estado.carregado);
    else if (st.erro) avisar(st.erro);
    else if (!st.pronto) $('infoShopee').textContent = 'Carregando…';
    if (!st.erro && motivo === 'conferido') avisar(estado.avisos || '');
  }

  // manter = atualização automática: preserva "Mostrar mais"
  function receber(d, manter) {
    estado.carregado = true;
    estado.dados = d;
    d.cartoes.forEach(function (c, i) {
      c.i = i;
      if (c.tipo === 'base') c.tracking = { status: c.status, dataOcorrencia: c.dataOcorrencia, cidade: c.cidade, previsao: c.previsao,
        codigo: c.codigo, autorizacao: c.autorizacao, protocolo: c.protocolo, pedido: c.pedido };
      c.busca = normalizar(c.titulo + ' ' + c.pedido);
    });
    var avisos = [];
    if (!d.abaRetorno) avisos.push('A aba Retorno_Extensão não foi encontrada (menu Correios › "Importar Retorno_Extensão (Shopee)").');
    if (d.faltando.length) avisos.push('Coluna(s) não encontrada(s): ' + d.faltando.join(', ') + '.');
    estado.avisos = avisos.join(' ');
    avisar(estado.avisos);
    estado.termo = null; // força montar as opções dos filtros (contagens novas; marcados continuam)
    aplicar(manter);
  }

  /* ---------- Quadro ---------- */

  // opções de cada filtro: valores dos cartões que passam na pesquisa, com contagem ("(vazio)" no fim)
  function montarFiltros(naPesquisa) {
    filtros().forEach(function (raiz) {
      var campo = raiz.getAttribute('data-campo');
      var contagem = {};
      naPesquisa.forEach(function (c) {
        var v = valorCampo(c, campo);
        var k = v === '' ? VAZIO : v;
        contagem[k] = (contagem[k] || 0) + 1;
      });
      FiltroMultiplo.preencher(raiz, Object.keys(contagem).sort(function (a, b) {
        if (a === VAZIO) return 1;
        if (b === VAZIO) return -1;
        return a.localeCompare(b, 'pt-BR', { numeric: true });
      }).map(function (v) { return { valor: v, rotulo: v === VAZIO ? '(vazio)' : v, qtd: contagem[v] }; }));
    });
  }

  // pesquisa + filtros; as opções dos filtros só são remontadas quando a pesquisa muda
  function aplicar(manterLimite) {
    if (!estado.dados) return;
    var termo = normalizar($('buscaShopee').value);
    var naPesquisa = termo ? estado.dados.cartoes.filter(function (c) { return c.busca.indexOf(termo) >= 0; }) : estado.dados.cartoes;
    if (termo !== estado.termo) { estado.termo = termo; montarFiltros(naPesquisa); }
    var ativos = filtros().map(function (raiz) {
      var conjunto = {};
      FiltroMultiplo.selecionados(raiz).forEach(function (v) { conjunto[v === VAZIO ? '' : v] = true; });
      return { campo: raiz.getAttribute('data-campo'), conjunto: conjunto, vazio: !Object.keys(conjunto).length };
    }).filter(function (f) { return !f.vazio; });
    estado.filtrados = !ativos.length ? naPesquisa : naPesquisa.filter(function (c) {
      for (var k = 0; k < ativos.length; k++) if (!ativos[k].conjunto[valorCampo(c, ativos[k].campo)]) return false;
      return true;
    });
    estado.comFiltro = !!termo || ativos.length > 0;
    if (manterLimite !== true) estado.limite = {};
    desenhar();
  }
  window.aplicarFiltrosShopee = aplicar;

  function desenhar() {
    var d = estado.dados;
    if (!d) return;
    var termo = estado.comFiltro;
    var lista = estado.filtrados || [];
    var porColuna = {};
    d.colunas.forEach(function (c) { porColuna[c.id] = []; });
    lista.forEach(function (c) { if (porColuna[c.coluna]) porColuna[c.coluna].push(c); });

    $('infoShopee').textContent = (termo
      ? numero(lista.length) + ' de ' + numero(d.cartoes.length) + ' cartão(ões) na pesquisa/filtros'
      : numero(d.cartoes.length) + ' cartão(ões) no quadro') +
      (d.foraDoQuadro ? ' · ' + numero(d.foraDoQuadro) + ' pedido(s) da Retorno_Extensão fora da regra (origem/situação)' : '');

    $('kanbanShopee').innerHTML = d.colunas.map(function (col) {
      var itens = porColuna[col.id];
      var limite = estado.limite[col.id] || POR_VEZ;
      var cartoes = itens.slice(0, limite).map(function (c) { return cartao(c, c.i); }).join('');
      var textoVazio = !col.definida ? 'Regra desta coluna ainda não definida.'
        : termo ? 'Nenhum pedido da pesquisa/filtros nesta coluna.' : 'Nenhum pedido nesta coluna.';
      var resto = itens.length - limite;
      return '<section class="kanban-coluna' + (itens.length ? ' com-itens' : '') + '" data-coluna="' + escapar(col.id) + '" aria-label="' + escapar(col.titulo) + '">' +
        '<header class="kanban-cabecalho"><h2 class="kanban-titulo">' + escapar(col.titulo) + '</h2>' +
        '<span class="contador kanban-contador">' + numero(itens.length) + '</span></header>' +
        (col.totalFora ? '<p class="kanban-nota">+ ' + numero(col.totalFora) + ' com mais de ' + (d.diasFinalizados || 25) + ' dias (só no total)</p>' : '') +
        '<ul class="kanban-lista">' + (cartoes || '<li class="kanban-vazio">' + textoVazio + '</li>') + '</ul>' +
        (resto > 0 ? '<button type="button" class="btn btn-secundario kanban-mais" data-mais="' + escapar(col.id) + '">Mostrar mais (' + numero(resto) + ')</button>' : '') +
        '</section>';
    }).join('');
  }

  function linhaPedido(p) {
    return '<div class="kanban-linha"><span>Pedido</span>' + (p ? '<span class="mono">' + escapar(p) + '</span>' : '<span>—</span>') + '</div>';
  }

  function cartao(c, k) {
    var partes = [linhaPedido(c.pedido)];
    if (c.tipo === 'retorno') {
      var extras = [];
      if (c.statusSolicitacao) extras.push('<span class="chip chip-neutro" title="' + escapar(c.statusSolicitacao) + '">' + escapar(c.statusSolicitacao) + '</span>');
      if (c.prazo) extras.push('<span class="kanban-prazo">' + RELOGIO + escapar(c.prazo) + '</span>');
      if (extras.length) partes.push('<div class="kanban-linha">' + extras.join('') + '</div>');
    } else {
      partes.push('<div class="kanban-linha"><span class="chip ' + corStatus(c.status) + '" title="' + escapar(c.status) + '">' + escapar(c.status || 'Sem status') + '</span></div>');
      partes.push('<div class="kanban-linha kanban-indicadores">' +
        '<span>Assist. técnica <span class="chip ' + chipSimNao(c.assistencia) + '">' + escapar(c.assistencia) + '</span></span>' +
        '<span>Entrada lista <span class="chip ' + chipSimNao(c.entradaLista) + '">' + escapar(c.entradaLista || '—') + '</span></span></div>');
      // marcas fora do padrão (violeta): finalizado à mão e possível duplicidade de protocolo
      var marcas = [];
      if (c.manual) marcas.push('<span class="chip chip-divergencia" title="' + escapar('Por ' + c.manual.por + ' em ' + c.manual.em) + '">Finalizado manualmente</span>');
      if (c.duplicidade) marcas.push('<span class="chip chip-divergencia" title="' + escapar('O protocolo ' + c.duplicidade + ' do mesmo pedido já foi resolvido') + '">Possível duplicidade</span>');
      if (marcas.length) partes.push('<div class="kanban-linha">' + marcas.join('') + '</div>');
    }
    var rotulo = (c.tipo === 'retorno' ? 'Pedido Shopee ' : 'Pedido do parceiro ') + c.titulo + ': ver detalhes';
    return '<li><button type="button" class="kanban-cartao" data-cartao="' + k + '" aria-label="' + escapar(rotulo) + '">' +
      '<span class="kanban-codigo">' + escapar(c.titulo) + '</span>' + partes.join('') + '</button></li>';
  }

  /* ---------- Janela de detalhes ---------- */

  function dado(rotulo, valor, mono) {
    return '<div><dt>' + escapar(rotulo) + '</dt><dd' + (mono && valor ? ' class="mono"' : '') + '>' + escapar(valor || '—') + '</dd></div>';
  }

  function abrirDetalhes(c, origem) {
    estado.aberto = c;
    estado.origem = origem;
    var t = c.tracking;
    var status = c.tipo === 'base' ? c.status : t && t.status;
    var coluna = (estado.dados.colunas.filter(function (x) { return x.id === c.coluna; })[0] || {}).titulo || '';
    $('shopeeRotulo').textContent = (c.tipo === 'retorno' ? 'Pedido Shopee' : 'Pedido do parceiro') + (coluna ? ' · ' + coluna : '');
    $('shopeeTitulo').textContent = c.titulo;
    $('shopeeChips').innerHTML = status ? '<span class="chip ' + corStatus(status) + '">' + escapar(status) + '</span>' : '';

    $('shopeeDados').innerHTML = c.tipo === 'retorno'
      ? dado('Pedido', c.pedido, true) + dado('Prazo', c.prazo) + dado('Status da solicitação', c.statusSolicitacao) + dado('Situação', c.situacao)
      : dado('Pedido', c.pedido, true) + dado('Protocolo', c.protocolo, true) + dado('Autorização Postagem', c.autorizacao, true) +
        dado('Assistência técnica', c.assistencia) + dado('Entrada na lista', c.entradaLista);

    $('shopeeTracking').innerHTML = t
      ? (c.tipo === 'retorno' ? dado('Status tracking', t.status) : '') +
        dado('Data ultima Ocorrencia', t.dataOcorrencia) + dado('Cidade ultima Ocorrencia', t.cidade) + dado('Data Prevista Entrega', t.previsao)
      : '';
    var nota = !t ? 'Este pedido não tem linha na Base_Dados (procurado pelo Pedido_Parceiro e pelo Pedido): sem dados de tracking.'
      : !t.codigo ? 'A linha da base não tem código de rastreio nem autorização para consultar.' : '';
    $('shopeeNota').textContent = nota;
    $('shopeeNota').hidden = !nota;
    $('shopeeTracking').hidden = !t;
    $('shopeeConsultar').disabled = !(t && t.codigo);
    mostrarManual(c);

    $('shopeeFundo').hidden = false;
    document.body.style.overflow = 'hidden';
    document.querySelector('[data-fechar-shopee]').focus();
  }

  // situação manual do cartão da base: quem finalizou, aviso de duplicidade e o botão forçar/desfazer
  function mostrarManual(c) {
    var base = c.tipo === 'base';
    $('shopeeManualBloco').hidden = !base;
    $('shopeeManual').hidden = !base;
    $('shopeeAcaoErro').hidden = true;
    if (!base) return;
    $('shopeeManualTexto').textContent = c.manual
      ? 'Finalizado manualmente por ' + c.manual.por + ' em ' + c.manual.em + '. Fora do tracking; aparece como finalizado no Acompanhamento - OUT.'
      : 'Sem ação manual. "Forçar finalizado" move o pedido para Finalizados e tira o protocolo do tracking (pode ser desfeito).';
    $('shopeeDuplicidade').textContent = c.duplicidade
      ? 'Possível duplicidade: o protocolo ' + c.duplicidade + ' do mesmo pedido já foi entregue e entrou na lista (ou foi finalizado manualmente).' : '';
    $('shopeeDuplicidade').hidden = !c.duplicidade;
    $('shopeeManualRotulo').textContent = c.manual ? 'Desfazer finalização' : 'Forçar finalizado';
    $('shopeeIconeForcar').hidden = !!c.manual;
    $('shopeeIconeDesfazer').hidden = !c.manual;
    $('shopeeManual').disabled = !c.protocolo;
  }

  function acaoManual() {
    var c = estado.aberto;
    if (!c || c.tipo !== 'base' || !window.DadosPainel) return;
    var protocolo = c.protocolo, botao = $('shopeeManual');
    botao.disabled = true;
    $('shopeeManualRotulo').textContent = 'Salvando…';
    $('shopeeAcaoErro').hidden = true;
    DadosPainel.acaoManual(protocolo, c.manual ? 'desfazer' : 'finalizar').then(function () {
      // a tela já foi redesenhada: reabre a janela com o cartão atualizado
      var novo = (estado.dados ? estado.dados.cartoes : []).filter(function (x) { return x.tipo === 'base' && x.protocolo === protocolo; })[0];
      if (novo && !$('shopeeFundo').hidden) abrirDetalhes(novo, document.querySelector('[data-cartao="' + novo.i + '"]') || estado.origem);
    }).catch(function (e) {
      botao.disabled = false;
      $('shopeeManualRotulo').textContent = c.manual ? 'Desfazer finalização' : 'Forçar finalizado';
      $('shopeeAcaoErro').textContent = 'Não foi possível salvar: ' + (e && e.message ? e.message : e);
      $('shopeeAcaoErro').hidden = false;
    });
  }

  function fecharDetalhes(devolverFoco) {
    if ($('shopeeFundo').hidden) return;
    $('shopeeFundo').hidden = true;
    document.body.style.overflow = '';
    if (devolverFoco !== false && estado.origem && estado.origem.focus) estado.origem.focus();
  }

  // consulta em tempo real: fecha esta janela e abre a de histórico (o foco volta ao cartão ao fechar)
  function consultarAgora() {
    var c = estado.aberto, t = c && c.tracking;
    if (!t || !t.codigo || !window.HistoricoTracking) return;
    fecharDetalhes(false);
    var contexto = [['Pedido', t.pedido || c.pedido], ['Protocolo', t.protocolo], [c.tipo === 'retorno' ? 'Pedido Shopee' : 'Pedido do parceiro', c.titulo]]
      .filter(function (p) { return p[1]; }).map(function (p) { return p[0] + ' ' + p[1]; }).join(' · ');
    HistoricoTracking.abrir({ codigo: t.codigo, protocolo: t.protocolo, autorizacao: t.autorizacao, contexto: contexto, origem: estado.origem });
  }

  /* ---------- Eventos ---------- */

  document.addEventListener('DOMContentLoaded', function () {
    var espera;
    $('buscaShopee').addEventListener('input', function () { clearTimeout(espera); espera = setTimeout(aplicar, 150); });
    $('limparShopee').addEventListener('click', function () { $('buscaShopee').value = ''; filtros().forEach(FiltroMultiplo.limpar); aplicar(); });
    $('atualizarShopee').addEventListener('click', carregar);
    $('kanbanShopee').addEventListener('click', function (e) {
      var mais = e.target.closest('[data-mais]');
      if (mais) {
        var id = mais.getAttribute('data-mais');
        estado.limite[id] = (estado.limite[id] || POR_VEZ) + POR_VEZ;
        desenhar();
        return;
      }
      var b = e.target.closest('[data-cartao]');
      if (b) abrirDetalhes(estado.dados.cartoes[Number(b.getAttribute('data-cartao'))], b);
    });
    $('shopeeConsultar').addEventListener('click', consultarAgora);
    $('shopeeManual').addEventListener('click', acaoManual);
    document.querySelector('[data-fechar-shopee]').addEventListener('click', function () { fecharDetalhes(); });
    $('shopeeFundo').addEventListener('click', function (e) { if (e.target === $('shopeeFundo')) fecharDetalhes(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharDetalhes(); });
  });

  // dados compartilhados (js/DadosPainel): cópia local na hora e conferência a cada 30 s
  document.addEventListener('DOMContentLoaded', function () {
    if (window.DadosPainel) DadosPainel.assinar(ouvir);
  });
})();
</script>
