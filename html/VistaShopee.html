<!-- Vista "Shopee": quadro kanban (aba Retorno_Extensão + aba base). Lógica em js/TelaShopee. -->
<section class="vista" data-vista="shopee" hidden>

  <div class="card-container barra-shopee">
    <div class="barra-shopee-topo">
      <div class="campo campo-busca">
        <label class="campo-rotulo" for="buscaShopee">Pesquisar</label>
        <input class="input" id="buscaShopee" type="search" autocomplete="off" spellcheck="false"
               placeholder="Pedido Shopee, Pedido_Parceiro ou Pedido">
      </div>
      <div class="acoes-filtro">
        <button class="btn btn-fantasma" id="limparShopee" type="button">Limpar</button>
        <button class="btn btn-secundario" id="atualizarShopee" type="button" title="Ler as abas de novo (ignora o cache)">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          <span>Atualizar</span>
        </button>
      </div>
    </div>
    <div class="barra-shopee-filtros">
      <!-- filtros de seleção múltipla (js/FiltroMultiplo); data-campo = campo do cartão -->
      <div class="campo">
        <span class="campo-rotulo">Status tracking</span>
        <div class="filtro-multiplo" data-filtro-multiplo data-campo="status" data-rotulo="Status" data-ao-mudar="aplicarFiltrosShopee">
          <button type="button" class="filtro-botao" data-acao="abrir" aria-haspopup="true" aria-expanded="false">
            <span class="filtro-titulo" data-titulo>Status (Todos)</span>
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="filtro-menu" data-menu hidden>
            <input class="input" type="search" data-acao="buscar" placeholder="Buscar status…" autocomplete="off">
            <div class="filtro-acoes"><button type="button" data-acao="todos">Selecionar todos</button><button type="button" data-acao="limpar">Limpar</button></div>
            <ul class="filtro-lista" data-lista></ul>
          </div>
        </div>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Status da solicitação</span>
        <div class="filtro-multiplo" data-filtro-multiplo data-campo="statusSolicitacao" data-rotulo="Solicitação" data-ao-mudar="aplicarFiltrosShopee">
          <button type="button" class="filtro-botao" data-acao="abrir" aria-haspopup="true" aria-expanded="false">
            <span class="filtro-titulo" data-titulo>Solicitação (Todos)</span>
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="filtro-menu" data-menu hidden>
            <input class="input" type="search" data-acao="buscar" placeholder="Buscar…" autocomplete="off">
            <div class="filtro-acoes"><button type="button" data-acao="todos">Selecionar todos</button><button type="button" data-acao="limpar">Limpar</button></div>
            <ul class="filtro-lista" data-lista></ul>
          </div>
        </div>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Prazo</span>
        <div class="filtro-multiplo" data-filtro-multiplo data-campo="prazo" data-rotulo="Prazo" data-ao-mudar="aplicarFiltrosShopee">
          <button type="button" class="filtro-botao" data-acao="abrir" aria-haspopup="true" aria-expanded="false">
            <span class="filtro-titulo" data-titulo>Prazo (Todos)</span>
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="filtro-menu" data-menu hidden>
            <input class="input" type="search" data-acao="buscar" placeholder="Buscar prazo…" autocomplete="off">
            <div class="filtro-acoes"><button type="button" data-acao="todos">Selecionar todos</button><button type="button" data-acao="limpar">Limpar</button></div>
            <ul class="filtro-lista" data-lista></ul>
          </div>
        </div>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Entrada na lista</span>
        <div class="filtro-multiplo" data-filtro-multiplo data-campo="entradaLista" data-rotulo="Entrada" data-ao-mudar="aplicarFiltrosShopee">
          <button type="button" class="filtro-botao" data-acao="abrir" aria-haspopup="true" aria-expanded="false">
            <span class="filtro-titulo" data-titulo>Entrada (Todos)</span>
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="filtro-menu" data-menu hidden>
            <input class="input" type="search" data-acao="buscar" placeholder="Buscar…" autocomplete="off">
            <div class="filtro-acoes"><button type="button" data-acao="todos">Selecionar todos</button><button type="button" data-acao="limpar">Limpar</button></div>
            <ul class="filtro-lista" data-lista></ul>
          </div>
        </div>
      </div>
      <div class="campo">
        <span class="campo-rotulo">Assistência técnica</span>
        <div class="filtro-multiplo" data-filtro-multiplo data-campo="assistencia" data-rotulo="Assistência" data-ao-mudar="aplicarFiltrosShopee">
          <button type="button" class="filtro-botao" data-acao="abrir" aria-haspopup="true" aria-expanded="false">
            <span class="filtro-titulo" data-titulo>Assistência (Todos)</span>
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="filtro-menu" data-menu hidden>
            <input class="input" type="search" data-acao="buscar" placeholder="Buscar…" autocomplete="off">
            <div class="filtro-acoes"><button type="button" data-acao="todos">Selecionar todos</button><button type="button" data-acao="limpar">Limpar</button></div>
            <ul class="filtro-lista" data-lista></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="aviso aviso-perigo" id="avisoShopee" role="alert" hidden></div>

  <div class="resumo-tabela">
    <span id="infoShopee" class="texto-apoio">Carregando…</span>
    <span id="atualizadoShopee" class="texto-apoio resumo-direita"></span>
  </div>

  <!-- colunas montadas por js/TelaShopee a partir de DadosPainel.telaShopee().colunas -->
  <div class="kanban" id="kanbanShopee" aria-live="polite"></div>

  <!-- Janela de detalhes do cartão (tracking da linha da base + consulta em tempo real) -->
  <div class="modal-fundo" id="shopeeFundo" hidden>
    <div class="modal modal-shopee" role="dialog" aria-modal="true" aria-labelledby="shopeeTitulo">
      <button class="btn btn-fantasma btn-icone modal-fechar" type="button" data-fechar-shopee aria-label="Fechar" title="Fechar (Esc)">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="shopee-det-topo">
        <span class="campo-rotulo" id="shopeeRotulo"></span>
        <h2 class="shopee-det-codigo" id="shopeeTitulo"></h2>
        <div class="shopee-det-chips" id="shopeeChips"></div>
      </div>
      <dl class="shopee-det-dados" id="shopeeDados"></dl>
      <h3 class="shopee-det-secao">Tracking</h3>
      <dl class="shopee-det-dados" id="shopeeTracking"></dl>
      <p class="texto-apoio shopee-det-nota" id="shopeeNota" hidden></p>
      <!-- situação manual (gs/EstadoManual): só para cartões da base -->
      <div class="shopee-det-manual" id="shopeeManualBloco" hidden>
        <h3 class="shopee-det-secao">Situação manual</h3>
        <p class="shopee-det-texto" id="shopeeManualTexto"></p>
        <p class="aviso aviso-divergencia" id="shopeeDuplicidade" hidden></p>
        <p class="aviso aviso-perigo" id="shopeeAcaoErro" role="alert" hidden></p>
      </div>
      <div class="modal-acoes">
        <button class="btn btn-secundario" id="shopeeManual" type="button" hidden>
          <svg class="icone" id="shopeeIconeForcar" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <svg class="icone" id="shopeeIconeDesfazer" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
          <span id="shopeeManualRotulo">Forçar finalizado</span>
        </button>
        <button class="btn btn-brand" id="shopeeConsultar" type="button">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Consultar tracking em tempo real</span>
        </button>
      </div>
    </div>
  </div>
</section>
